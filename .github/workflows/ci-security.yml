name: security

# Stage of ci.yml; not triggered on its own. Its jobs show up as
# "security / dependency vulnerabilities" and "security / secrets".
# Both scanners run in ~20s, so they are deliberately not path-filtered.
on:
  workflow_call:

permissions:
  contents: read

env:
  OSV_SCANNER_VERSION: "2.5.1"
  GITLEAKS_VERSION: "8.30.1"

jobs:
  dependencies:
    name: dependency vulnerabilities
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install osv-scanner
        run: |
          set -euo pipefail
          base="https://github.com/google/osv-scanner/releases/download/v${OSV_SCANNER_VERSION}"
          curl -fsSL -o "${RUNNER_TEMP}/osv-scanner" "${base}/osv-scanner_linux_amd64"
          curl -fsSL -o "${RUNNER_TEMP}/SHA256SUMS" "${base}/osv-scanner_SHA256SUMS"
          expected="$(grep ' osv-scanner_linux_amd64$' "${RUNNER_TEMP}/SHA256SUMS" | cut -d' ' -f1)"
          echo "${expected}  ${RUNNER_TEMP}/osv-scanner" | sha256sum -c -
          chmod +x "${RUNNER_TEMP}/osv-scanner"
      - name: Scan lockfiles
        run: |
          set -uo pipefail
          # `|| code=$?`: the runner's shell is `bash -e`, so a bare findings exit (1)
          # would end the step here and the policy step below would never decide.
          code=0
          "${RUNNER_TEMP}/osv-scanner" scan source \
            --lockfile backend/uv.lock \
            --lockfile frontend/pubspec.lock \
            --format json --output-file "${RUNNER_TEMP}/osv.json" || code=$?
          # 0 = clean, 1 = findings (osv_policy.py decides), >=127 = real error.
          if [ "${code}" -ge 127 ]; then
            echo "::error::osv-scanner failed with exit code ${code} (127=error, 128=no packages found)"
            exit 1
          fi
      # On a PR, scan the base branch's lockfiles too so the gate only fails on
      # vulnerabilities this PR actually introduces.
      - name: Scan base lockfiles (PR only)
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -uo pipefail
          mkdir -p "${RUNNER_TEMP}/baseline/backend" "${RUNNER_TEMP}/baseline/frontend"
          args=""
          if git show "${BASE_SHA}:backend/uv.lock" > "${RUNNER_TEMP}/baseline/backend/uv.lock" 2>/dev/null; then
            args="${args} --lockfile ${RUNNER_TEMP}/baseline/backend/uv.lock"
          fi
          if git show "${BASE_SHA}:frontend/pubspec.lock" > "${RUNNER_TEMP}/baseline/frontend/pubspec.lock" 2>/dev/null; then
            args="${args} --lockfile ${RUNNER_TEMP}/baseline/frontend/pubspec.lock"
          fi
          if [ -z "${args}" ]; then
            echo "No lockfiles on the base ref; every finding counts as new."
            exit 0
          fi
          # shellcheck disable=SC2086
          code=0
          "${RUNNER_TEMP}/osv-scanner" scan source ${args} \
            --format json --output-file "${RUNNER_TEMP}/osv-baseline.json" || code=$?
          if [ "${code}" -ge 127 ]; then
            echo "::warning::baseline scan failed (exit ${code}); every finding counts as new."
            rm -f "${RUNNER_TEMP}/osv-baseline.json"
          fi
      # Also writes the job summary.
      - name: Apply severity policy
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          baseline=""
          if [ "${EVENT_NAME}" = "pull_request" ]; then
            threshold=high
            if [ -f "${RUNNER_TEMP}/osv-baseline.json" ]; then
              baseline="--baseline ${RUNNER_TEMP}/osv-baseline.json"
            fi
          else
            threshold=any
          fi
          # shellcheck disable=SC2086
          python3 .github/scripts/osv_policy.py \
            --results "${RUNNER_TEMP}/osv.json" \
            --threshold "${threshold}" \
            ${baseline}

  secrets:
    name: secrets
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -fsSL -o "${RUNNER_TEMP}/gitleaks.tar.gz" "${base}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "${RUNNER_TEMP}/checksums.txt" "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          expected="$(grep "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz\$" "${RUNNER_TEMP}/checksums.txt" | cut -d' ' -f1)"
          echo "${expected}  ${RUNNER_TEMP}/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "${RUNNER_TEMP}/gitleaks.tar.gz" -C "${RUNNER_TEMP}" gitleaks
          chmod +x "${RUNNER_TEMP}/gitleaks"
      # --redact keeps any matched secret out of the job log and the report. Both
      # events scan only the commits they introduce: history cannot change without
      # a force-push, so every new secret arrives inside some PR or push range, and
      # re-scanning old history would only re-report what was already judged.
      - name: Scan for secrets
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "${EVENT_NAME}" = "pull_request" ]; then
            range="--no-merges ${BASE_SHA}..HEAD"
          elif git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            range="${BEFORE_SHA}..HEAD"
          else
            # First push to the branch (all-zero before) or a force-push whose old
            # tip was not fetched: there is no range, so scan the tip commit alone.
            echo "::warning::no previous commit to diff against; scanning HEAD only"
            range="-1 HEAD"
          fi
          "${RUNNER_TEMP}/gitleaks" git . --redact --no-banner --log-opts="${range}" \
            --report-format json --report-path "${RUNNER_TEMP}/gitleaks.json"
      - name: Job summary
        if: always()
        run: |
          python3 "${GITHUB_WORKSPACE}/.github/scripts/ci_summary.py" \
            --gitleaks "${RUNNER_TEMP}/gitleaks.json"
