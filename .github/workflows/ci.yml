name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege by default; jobs elevate only what they need.
permissions:
  contents: read

# PRs: superseded runs are pointless, cancel them.
# main: every commit must have its own auditable result, so never cancel.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FLUTTER_VERSION: "3.44.8"

# The pipeline runs in three stages, each a reusable workflow that the run
# graph draws as one box: lint (ci-lint.yml), test (ci-test.yml) and security
# (ci-security.yml). Stages run in parallel - none waits on another - so one
# red stage never hides the verdict of the others.
#
# Every job pins `ubuntu-24.04` rather than `ubuntu-latest`, which moves to
# Ubuntu 26.04 from 2026-10-19: an image upgrade is its own deliberate commit.
jobs:
  # Skips the heavy SDK jobs when a PR touches only one side of the monorepo.
  changes:
    name: changes
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      # A reusable workflow call cannot read `env`, so the pin travels as an output.
      flutter-version: ${{ env.FLUTTER_VERSION }}
    steps:
      # On push, paths-filter diffs against the previous tip via git. Without
      # full history it tries to fetch that commit, which fails once
      # credentials are dropped on a private repo.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/**'
              - '.github/scripts/**'
            frontend:
              - 'frontend/**'
              - '.github/workflows/**'
              - '.github/scripts/**'

  lint:
    name: lint
    needs: changes
    uses: ./.github/workflows/ci-lint.yml
    with:
      backend: ${{ needs.changes.outputs.backend == 'true' }}
      frontend: ${{ needs.changes.outputs.frontend == 'true' }}
      flutter-version: ${{ needs.changes.outputs.flutter-version }}

  test:
    name: test
    needs: changes
    uses: ./.github/workflows/ci-test.yml
    with:
      backend: ${{ needs.changes.outputs.backend == 'true' }}
      frontend: ${{ needs.changes.outputs.frontend == 'true' }}
      flutter-version: ${{ needs.changes.outputs.flutter-version }}

  security:
    name: security
    uses: ./.github/workflows/ci-security.yml

  # The single required status check. Path-filtered jobs that get skipped would
  # otherwise sit pending forever under branch protection and deadlock merges.
  ci-ok:
    name: ci-ok
    runs-on: ubuntu-24.04
    if: always()
    needs:
      - changes
      - lint
      - test
      - security
    steps:
      - name: Verify no job failed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          echo "Job results: ${RESULTS}"
          for r in ${RESULTS}; do
            if [ "${r}" = "failure" ] || [ "${r}" = "cancelled" ]; then
              echo "::error::A required job reported '${r}'."
              exit 1
            fi
          done
          echo "All required jobs passed or were skipped."
