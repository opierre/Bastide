name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege by default; jobs elevate only what they need.
permissions:
  contents: read

# PRs: superseded runs are pointless, cancel them.
# main: every commit must have its own auditable result, so never cancel.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FLUTTER_VERSION: "3.44.8"
  OSV_SCANNER_VERSION: "2.5.1"
  GITLEAKS_VERSION: "8.30.1"

jobs:
  # Skips the heavy SDK jobs when a PR touches only one side of the monorepo.
  # The scanner jobs run in ~20s, so they are deliberately not gated on this.
  changes:
    name: changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'

  backend-lint:
    name: backend / lint
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          working-directory: backend
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install dependencies
        run: uv sync --frozen
      - name: ruff check
        run: uv run ruff check --output-format=github .
      - name: ruff format
        run: uv run ruff format --check .
      # NOT blocking yet: `ty check` currently reports 13 pre-existing
      # invalid-argument-type errors in the CSV import parser and its tests.
      # Flip to blocking once those are fixed - see CI-PLAN.md.
      - name: ty check (non-blocking)
        continue-on-error: true
        run: uv run ty check

  backend-test:
    name: backend / test
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          working-directory: backend
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install dependencies
        run: uv sync --frozen
      - name: pytest
        run: uv run pytest -q

  frontend-lint:
    name: frontend / lint
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
          pub-cache-key: pub-${{ runner.os }}-${{ hashFiles('frontend/pubspec.lock') }}
      - name: flutter pub get
        run: flutter pub get
      - name: flutter analyze
        run: flutter analyze
      # i18n day one: the committed AppLocalizations must match the ARB sources.
      - name: l10n is up to date
        run: |
          flutter gen-l10n
          if ! git diff --quiet -- lib/l10n; then
            echo "::error::lib/l10n is stale. Run 'flutter gen-l10n' and commit the result."
            git --no-pager diff --stat -- lib/l10n
            exit 1
          fi
      # NOT blocking yet: the frontend has never been run through the Dart 3.7+
      # formatter, so 132 of 177 files would fail. Flip to blocking after a
      # standalone reformat commit - see CI-PLAN.md.
      - name: dart format (non-blocking)
        continue-on-error: true
        run: dart format --output=none --set-exit-if-changed lib test

  frontend-test:
    name: frontend / test
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
          pub-cache-key: pub-${{ runner.os }}-${{ hashFiles('frontend/pubspec.lock') }}
      - name: flutter pub get
        run: flutter pub get
      - name: flutter test
        run: flutter test

  deps-vulns:
    name: security / dependency vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install osv-scanner
        run: |
          set -euo pipefail
          base="https://github.com/google/osv-scanner/releases/download/v${OSV_SCANNER_VERSION}"
          curl -fsSL -o "${RUNNER_TEMP}/osv-scanner" "${base}/osv-scanner_linux_amd64"
          curl -fsSL -o "${RUNNER_TEMP}/SHA256SUMS" "${base}/osv-scanner_SHA256SUMS"
          expected="$(grep ' osv-scanner_linux_amd64$' "${RUNNER_TEMP}/SHA256SUMS" | cut -d' ' -f1)"
          echo "${expected}  ${RUNNER_TEMP}/osv-scanner" | sha256sum -c -
          chmod +x "${RUNNER_TEMP}/osv-scanner"
      - name: Scan lockfiles
        run: |
          set -uo pipefail
          "${RUNNER_TEMP}/osv-scanner" scan source \
            --lockfile backend/uv.lock \
            --lockfile frontend/pubspec.lock \
            --format json --output-file "${RUNNER_TEMP}/osv.json"
          code=$?
          # 0 = clean, 1 = findings (osv_policy.py decides), >=127 = real error.
          if [ "${code}" -ge 127 ]; then
            echo "::error::osv-scanner failed with exit code ${code} (127=error, 128=no packages found)"
            exit 1
          fi
      # On a PR, scan the base branch's lockfiles too so the gate only fails on
      # vulnerabilities this PR actually introduces.
      - name: Scan base lockfiles (PR only)
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -uo pipefail
          mkdir -p "${RUNNER_TEMP}/baseline/backend" "${RUNNER_TEMP}/baseline/frontend"
          args=""
          if git show "${BASE_SHA}:backend/uv.lock" > "${RUNNER_TEMP}/baseline/backend/uv.lock" 2>/dev/null; then
            args="${args} --lockfile ${RUNNER_TEMP}/baseline/backend/uv.lock"
          fi
          if git show "${BASE_SHA}:frontend/pubspec.lock" > "${RUNNER_TEMP}/baseline/frontend/pubspec.lock" 2>/dev/null; then
            args="${args} --lockfile ${RUNNER_TEMP}/baseline/frontend/pubspec.lock"
          fi
          if [ -z "${args}" ]; then
            echo "No lockfiles on the base ref; every finding counts as new."
            exit 0
          fi
          # shellcheck disable=SC2086
          "${RUNNER_TEMP}/osv-scanner" scan source ${args} \
            --format json --output-file "${RUNNER_TEMP}/osv-baseline.json"
          code=$?
          if [ "${code}" -ge 127 ]; then
            echo "::warning::baseline scan failed (exit ${code}); every finding counts as new."
            rm -f "${RUNNER_TEMP}/osv-baseline.json"
          fi
      - name: Apply severity policy
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          baseline=""
          if [ "${EVENT_NAME}" = "pull_request" ]; then
            threshold=high
            if [ -f "${RUNNER_TEMP}/osv-baseline.json" ]; then
              baseline="--baseline ${RUNNER_TEMP}/osv-baseline.json"
            fi
          else
            threshold=any
          fi
          # shellcheck disable=SC2086
          python3 .github/scripts/osv_policy.py \
            --results "${RUNNER_TEMP}/osv.json" \
            --threshold "${threshold}" \
            ${baseline}

  secrets:
    name: security / secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -fsSL -o "${RUNNER_TEMP}/gitleaks.tar.gz" "${base}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "${RUNNER_TEMP}/checksums.txt" "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          expected="$(grep "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz\$" "${RUNNER_TEMP}/checksums.txt" | cut -d' ' -f1)"
          echo "${expected}  ${RUNNER_TEMP}/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "${RUNNER_TEMP}/gitleaks.tar.gz" -C "${RUNNER_TEMP}" gitleaks
          chmod +x "${RUNNER_TEMP}/gitleaks"
      # --redact keeps any matched secret out of the job log.
      - name: Scan for secrets
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ "${EVENT_NAME}" = "pull_request" ]; then
            "${RUNNER_TEMP}/gitleaks" git . --redact --no-banner \
              --log-opts="--no-merges ${BASE_SHA}..HEAD"
          else
            "${RUNNER_TEMP}/gitleaks" git . --redact --no-banner
          fi

  # The single required status check. Path-filtered jobs that get skipped would
  # otherwise sit pending forever under branch protection and deadlock merges.
  ci-ok:
    name: ci-ok
    runs-on: ubuntu-latest
    if: always()
    needs:
      - changes
      - backend-lint
      - backend-test
      - frontend-lint
      - frontend-test
      - deps-vulns
      - secrets
    steps:
      - name: Verify no job failed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          echo "Job results: ${RESULTS}"
          for r in ${RESULTS}; do
            if [ "${r}" = "failure" ] || [ "${r}" = "cancelled" ]; then
              echo "::error::A required job reported '${r}'."
              exit 1
            fi
          done
          echo "All required jobs passed or were skipped."
