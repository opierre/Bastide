[project]
name = "bastide-backend"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.18.5",
    "argon2-cffi>=25.1.0",
    "fastapi>=0.139.2",
    "httpx>=0.28.1",
    "platformdirs>=4.12.4",
    "pydantic>=2",
    "pydantic-settings>=2.14.2",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2",
    "uvicorn>=0.51.0",
]

# The project is installed (editable) so `app.__version__` can read this version from the
# package metadata instead of a second hand-kept copy.
[build-system]
requires = ["uv_build>=0.9,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"
module-root = ""

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.15.22",
    "ty>=0.0.61",
]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ty.environment]
python-version = "3.14"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Every test owns its temp database, so the suite runs across all cores; `-n 0` runs it serially.
addopts = ["-n", "auto"]

# Used by `uv run pytest --cov`; CI adds the XML report for the job summary.
[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
skip_empty = true
