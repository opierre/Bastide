name: bastide
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 0.2.0-dev.12+5

environment:
  sdk: ^3.12.0

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  flutter_riverpod: ^3.3.2
  go_router: ^17.3.0
  intl: ^0.20.2
  flutter_localizations:
    sdk: flutter
  http: ^1.6.0
  flutter_secure_storage: ^10.3.1
  # The imports DropZone needs both halves of "drop/pick a file", and Flutter
  # ships neither: file_selector opens the native browse dialog, desktop_drop
  # provides the drag-and-drop target. See docs/design/06-imports.md.
  file_selector: ^1.0.3
  desktop_drop: ^0.6.0
  # « En savoir plus » on the settings AI card hands the user off to the
  # runtime's own download page — the one link in the app that leaves it.
  # Nothing about the user is carried across; it opens the default browser.
  url_launcher: ^6.3.2
  # The version shown in Settings › À propos is read from the built app, so it
  # can't drift from `version:` above (or from `--build-name` in release CI).
  package_info_plus: ^10.2.2
  # Finds the frozen backend beside the app's own executable.
  path: ^1.9.1
  # Native memory for the Windows job object that ends the backend with the
  # app (core/backend/windows_job.dart).
  ffi: ^2.2.0
  lucide_icons_flutter: ^4.0.3
  # Device-local UI preferences that are not the user's data and so do not
  # belong in the backend: the collapsed sidebar (core/storage/ui_preferences).
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  generate: true

  # Third-party notices the app registers with Flutter's LicenseRegistry
  # (`lib/core/third_party_licenses.dart`). Lucide's ISC notice must travel
  # with every copy of the icons; the package that ships the font carries only
  # its own MIT licence.
  assets:
    - assets/licenses/lucide/LICENSE

  # Geist carries the whole UI at 400, 500 and 600; Geist Mono 400 sets raw bank
  # labels, rule patterns, file names and URLs. Space Grotesk is gone.
  # See docs/design/00-design-system.md §3.
  #
  # Both ship from Google Fonts as `wght` variable fonts only; the statics here
  # were instanced from them so the weights the scale asks for resolve through
  # `fontWeight` alone, without every call site carrying `fontVariations`.
  fonts:
    - family: Geist
      fonts:
        - asset: assets/fonts/Geist/static/Geist-Regular.ttf
          weight: 400
        - asset: assets/fonts/Geist/static/Geist-Medium.ttf
          weight: 500
        - asset: assets/fonts/Geist/static/Geist-SemiBold.ttf
          weight: 600
    - family: Geist Mono
      fonts:
        - asset: assets/fonts/GeistMono/static/GeistMono-Regular.ttf
          weight: 400
